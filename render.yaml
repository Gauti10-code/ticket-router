services:
  - type: web
    name: ticket-router
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-router-db
          property: connectionString

databases:
  - name: ticket-router-db
    plan: free
    region: singapore