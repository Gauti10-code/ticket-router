name: CI

# When this runs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train the model
        # The .joblib is gitignored, so CI has to produce it before the
        # tests that need a loaded model can pass.
        run: python scripts/train.py

      - name: Run tests
        run: pytest -v

  # ---------------------------------------------------------------- docker
  docker:
    runs-on: ubuntu-latest
    needs: test          # only runs if the test job passed

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Train the model
        run: |
          pip install -r requirements.txt
          python scripts/train.py

      - name: Build the image
        run: docker build -t ticket-router:${{ github.sha }} .

      - name: Smoke-test the container
        # Start it, wait, hit /health, then clean up. Proves the image
        # actually runs — a build succeeding doesn't prove that.
        run: |
          docker run -d -p 8000:8000 --name tr ticket-router:${{ github.sha }}
          sleep 10
          curl --fail http://localhost:8000/health
          docker stop tr